# For Development
cortexm4 = { path = "/home/ash/Downloads/Rust/tock/arch/cortex-m4" }
capsules-core  = { path = "/home/ash/Downloads/Rust/tock/capsules/core" }
capsules-extra  = { path = "/home/ash/Downloads/Rust/tock/capsules/extra" }
kernel = { path = "/home/ash/Downloads/Rust/tock/kernel" }
nrf52 = { path = "/home/ash/Downloads/Rust/tock/chips/nrf52" }
nrf52840 = { path = "/home/ash/Downloads/Rust/tock/chips/nrf52840" }
components = { path = "/home/ash/Downloads/Rust/tock/boards/components" }
nrf52_components = { path = "/home/ash/Downloads/Rust/tock/boards/nordic/nrf52_components" }

bootloader = { path = "../../bootloader" }
bootloader_nrf52 = { path = "../../chips/bootloader_nrf52" }
bootloader_cortexm = { path = "../../arch/bootloader_cortexm" }


[build-dependencies]
bootloader_attributes = { path = "../../tools/bootloader_attributes" }

[profile.dev]
panic = "abort"
lto = false
opt-level = "z"
debug = true

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
debug = false
